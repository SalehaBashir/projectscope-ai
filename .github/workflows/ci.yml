name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------
  # 1. Lint
  # ---------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check . || true
      - name: Black format check
        run: black --check . || true

  # ---------------------------------------------------------
  # 2. Unit tests
  # ---------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: projectscope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/projectscope_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: dummy-ci-secret-key-for-testing-only
      DISABLE_RATE_LIMIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Run unit tests
        run: pytest -m "not integration" --maxfail=1 --disable-warnings -q

  # ---------------------------------------------------------
  # 3. Type checks
  # ---------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install mypy
      - name: Mypy type check
        run: mypy app --ignore-missing-imports || true

  # ---------------------------------------------------------
  # 4. Security scan
  # ---------------------------------------------------------
  security-scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (dependencies + code)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0
      - name: Bandit Python security lint
        working-directory: backend
        run: |
          pip install bandit
          bandit -r app -ll || true

  # ---------------------------------------------------------
  # 5. Build (Docker image)
  # ---------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: [test, typecheck, security-scan]
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Build backend image
        run: docker build -t projectscope-backend:${{ github.sha }} ./backend
      - name: Trivy scan the built image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: projectscope-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 0
      # To push this image somewhere, add a registry login step here, e.g.:
      #   - uses: docker/login-action@v3
      #     with:
      #       registry: ghcr.io
      #       username: ${{ github.actor }}
      #       password: ${{ secrets.GITHUB_TOKEN }}
      #   - run: docker push ghcr.io/<you>/projectscope-backend:${{ github.sha }}

  # ---------------------------------------------------------
  # 6. Integration tests
  # ---------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: projectscope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/projectscope_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: dummy-ci-secret-key-for-testing-only
      DISABLE_RATE_LIMIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - name: Run integration tests (full API flows)
        run: pytest -m integration --disable-warnings -q || true

  # ---------------------------------------------------------
  # 7. Deploy to staging
  # ---------------------------------------------------------
  deploy-staging:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.STAGING_DEPLOY_HOOK }}"

  # ---------------------------------------------------------
  # 8. Smoke tests (against staging)
  # ---------------------------------------------------------
  smoke-tests:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Hit /health on staging
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_URL }}/health")
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: staging /health returned $STATUS"
            exit 1
          fi
          echo "Smoke test passed"

  # ---------------------------------------------------------
  # 9. Deploy to production
  # ---------------------------------------------------------
  deploy-production:
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo "Deploy step goes here — depends on chosen host."
          echo "Example: curl the production deploy hook URL stored in secrets.PROD_DEPLOY_HOOK"
        env:
          PROD_DEPLOY_HOOK: ${{ secrets.PROD_DEPLOY_HOOK }}