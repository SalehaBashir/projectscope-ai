services:
  postgres:
    image: postgres:16
    container_name: projectscope-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projectscope
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: projectscope-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: projectscope-backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/projectscope
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY}
    depends_on:
      - postgres
      - redis

  worker:
    build: ./backend
    container_name: projectscope-worker
    restart: always
    command: rq worker projectscope-jobs --url redis://redis:6379
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/projectscope
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY}
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: